[package]
name = "osiris-kernel"
version = "0.1.0"
edition = "2021"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
bootloader = "0.8.2"

[target.'cfg(target_os = "none")']
rustflags = [
    "--cfg", "feature=\"no_std\"",
    "-C", "link-arg=-Tlink-x86_64.x",
    "-C", "linker=rust-lld"
]